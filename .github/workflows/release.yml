name: Release

on:
  push:
    branches: [main]        # release automatically when the version changes
    tags: ["v*"]            # ...or on an explicit tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide whether this push should produce a release: only when the version in
  # pyproject.toml has no release yet. Tag pushes always release.
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V is already released - skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$V has no release yet - building"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-14 # Apple Silicon
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('aidr.py') }}-qwen3-0.6b-q8
          restore-keys: hf-

      - name: Build aidr.app
        run: ./build.sh

      # Optional Developer ID signing — runs only when the three MACOS_* secrets
      # are configured. Otherwise the app ships ad-hoc signed (right-click → Open).
      - name: Sign with Developer ID
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          codesign --deep --force --options runtime --timestamp \
            --entitlements aidr.entitlements \
            --sign "$MACOS_SIGN_IDENTITY" dist/aidr.app
          codesign --verify --deep --strict dist/aidr.app
          rm -f cert.p12

      # Notarize + staple, so Gatekeeper accepts the app on other Macs.
      # Runs only when the APPLE_API_* secrets are configured.
      - name: Notarize and staple
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > AuthKey.p8
          ditto -c -k --keepParent dist/aidr.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --key AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 45m
          xcrun stapler staple dist/aidr.app
          xcrun stapler validate dist/aidr.app
          spctl -a -vvv -t exec dist/aidr.app || true
          rm -f AuthKey.p8 notarize.zip

      - name: Build the disk image
        run: |
          STAGE=$(mktemp -d)
          cp -R dist/aidr.app "$STAGE/aidr.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "ai;dr" -srcfolder "$STAGE" -ov -format UDZO -quiet aidr.dmg
          rm -rf "$STAGE"
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" aidr.dmg
          fi

      # The app inside is already stapled; notarize the image too so the
      # download itself validates offline.
      - name: Notarize and staple the disk image
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > AuthKey.p8
          xcrun notarytool submit aidr.dmg \
            --key AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 45m
          xcrun stapler staple aidr.dmg
          xcrun stapler validate aidr.dmg
          rm -f AuthKey.p8

      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent dist/aidr.app aidr.zip

      - name: Clean up the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aidr.dmg
            aidr.zip
          tag_name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
